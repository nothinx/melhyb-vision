services:
  sigma:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      SIGMA_DATABASE_URL: sqlite:////data/sigma.db
      SIGMA_STORAGE_DIR: /data/storage
      SIGMA_MODEL_DIR: /data/models
    volumes:
      - sigma-data:/data
    restart: unless-stopped

volumes:
  sigma-data:
